schema_version = "loopx_extension_manifest_v0"
id = "loopx-lark"
version = "1.5.0"
requires_loopx_api = ">=1,<2"
permissions = [
  "lark.inbox.read",
  "lark.inbox.write",
  "lark.reply.send",
  "lark.collector.manage",
  "lark.reviewer_notification.send",
  "lark.projection_sink.use",
  "lark.miaoda_html.publish",
  "lark.goal_channel.manage",
]

[runtime]
protocol = "lark_extension_lifecycle_v0"
python_module = "loopx.extensions.lark.provider"
args = []
doctor_args = ["--doctor"]
required_permissions = []
timeout_seconds = 30

[documentation]
source_root = "loopx/extensions/lark"
site_root = "integrations/lark-provider"
canonical = "README.md"

[[documentation.aliases]]
source = "docs/lark-event-inbox.md"
site = "capabilities/lark-event-inbox.md"

[[provides]]
id = "lark-event-inbox"
kind = "event_inbox"
title = "Lark event inbox"
status = "active-preview"
visibility = "public"
real_world_anchor = "host-collected project feedback from a configured Lark chat"
user_value = "Collect live feedback, reconcile bounded group history, inspect link evidence, reply, and acknowledge without making chat the control-plane source of truth."
entry_command = "loopx lark-inbox drain --goal-id <goal-id>"
next_real_step = "Install and explicitly enable the bundled provider before configuring a project inbox."

[[provides]]
id = "lark-reviewer-notification"
kind = "notification_sink"
title = "Lark reviewer notification"
status = "active-preview"
visibility = "public"
real_world_anchor = "verified reviewer requests sent through a project-dedicated Lark app"
user_value = "Deliver idempotent reviewer notifications with identity, membership, semantic-dedupe, and readback verification."
entry_command = "loopx issue-fix reviewer-request --goal-id <goal-id> --url <pr-url>"
next_real_step = "Install or upgrade and explicitly enable the bundled provider before configuring a Lark reviewer notification sink."

[[provides]]
id = "lark-kanban-projection"
kind = "projection_sink"
title = "Lark Kanban projection"
status = "active-preview"
visibility = "public"
real_world_anchor = "LoopX todo and control-plane projections rendered into a configured Lark Base"
user_value = "Give operators a bounded, lineage-preserving Kanban view without making Lark the control-plane source of truth."
entry_command = "loopx lark-kanban sync-projection --projection-file <projection.json>"
next_real_step = "Install or upgrade and explicitly enable the bundled provider before configuring a Lark Kanban sink."

[[provides]]
id = "lark-goal-channel"
kind = "collaboration_channel"
title = "Lark Goal Channel"
status = "active-preview"
visibility = "public"
real_world_anchor = "one verified Lark group and Kanban projection bound to one LoopX goal"
user_value = "Keep goal progress and human gates visible in one collaboration channel while LoopX remains the source of truth."
entry_command = "loopx goal-channel setup --provider lark --goal-id <goal-id>"
next_real_step = "Install or upgrade and explicitly enable the bundled provider before configuring a Goal Channel."

[[provides]]
id = "lark-explore-projection"
kind = "projection_sink"
title = "Lark Explore projection"
status = "active-preview"
visibility = "public"
real_world_anchor = "LoopX Explore rows, cards, and whiteboards projected into configured Lark surfaces"
user_value = "Publish canonical and executive Explore views from one bounded result log with readback and source-lineage checks."
entry_command = "loopx explore feishu-sync --goal-id <goal-id>"
next_real_step = "Install or upgrade and explicitly enable the bundled provider before configuring a Lark Explore sink."

[[provides]]
id = "lark-periodic-report-announcement"
kind = "delivery_sink"
title = "Audience-aware periodic report announcement"
status = "active-preview"
visibility = "public"
real_world_anchor = "a periodic report delivered to a configured Lark chat with only relevant recipients mentioned"
user_value = "Deliver one report while mentioning only symbolic recipients selected by normalized domains or explicit typed routing rules."
entry_command = "loopx periodic-report deliver-goal-channel --goal-id <goal-id> --request-json <request.json>"
next_real_step = "Bind one project_bot Goal Channel, preview the typed delivery intent, then execute with exact sender and chat readback."

[[provides]]
id = "lark-miaoda-html-report"
kind = "delivery_sink"
title = "Miaoda HTML report publication"
status = "active-preview"
visibility = "public"
real_world_anchor = "a self-contained LoopX report published to an operator-selected existing Miaoda HTML app"
user_value = "Publish the generated HTML artifact without re-rendering it, with bounded size preflight and exact app, URL, and published-state readback."
entry_command = "loopx periodic-report publish-miaoda --request-json <request.json>"
next_real_step = "Enable the bundled Lark provider, select an existing Miaoda app in the typed delivery intent, preview it, and then execute it explicitly."
