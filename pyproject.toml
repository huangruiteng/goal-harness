[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx"
version = "0.5.3"
description = "A lightweight Loop Engineering control plane for long-running agent goals."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT"]
authors = [{ name = "LoopX contributors" }]
dependencies = []

[project.urls]
Homepage = "https://huangruiteng.github.io/loopx/"
Documentation = "https://huangruiteng.github.io/loopx/docs/"
Repository = "https://github.com/huangruiteng/loopx"
Issues = "https://github.com/huangruiteng/loopx/issues"
Changelog = "https://github.com/huangruiteng/loopx/releases"

[project.optional-dependencies]
deepseek-harness = [
  "deepseek-harness-sdk>=0.1.0rc5",
]
test = [
  "jsonschema>=4.23,<5",
  "mcp==1.28.1",
  "types-jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3,<4",
  "ruff>=0.12,<0.16",
  "mypy>=1.18,<2",
]

[project.scripts]
loopx = "loopx.entrypoint:main"
loopx-kunluncode = "loopx.kunluncode_goal_mode.cli:main"
loopx-lark-provider = "loopx.extensions.lark.provider:main"
loopx-openviking-history-export = "loopx.extensions.openviking_semantic_preference.history_export:main"
loopx-openviking-semantic-preference = "loopx.extensions.openviking_semantic_preference.provider:main"

[tool.setuptools.packages.find]
include = ["loopx*"]

[tool.setuptools.package-data]
"loopx" = ["web/chat/*.html", "web/chat/assets/*", "web/chat/manifest.webmanifest", "web/chat/pwa/*"]
"loopx.control_plane" = ["*.json", "*.ts"]
"loopx.control_plane.agents" = ["*.ts"]
"loopx.control_plane.goals" = ["*.ts"]
"loopx.control_plane.quota" = ["*.ts"]
"loopx.control_plane.scheduler" = ["*.ts"]
"loopx.control_plane.todos" = ["*.ts"]
"loopx.control_plane.turn_driver" = ["*.ts"]
"loopx.control_plane.work_items" = ["*.ts"]
"*" = ["README.md", "README.zh-CN.md", "docs/*.md", "docs/protocols/*.md"]
"loopx.capabilities.content_ops" = ["templates/*.json"]
"loopx.extensions.lark" = ["extension.toml", "README.md", "docs/*.md"]
"loopx.extensions.openviking_periodic_report" = ["extension.toml"]
"loopx.extensions.openviking_semantic_preference" = ["extension.toml"]
"loopx.dsh_goal_mode" = ["README.md"]
"loopx.opencode_goal_mode" = ["*.js", "*.mjs", "README.md"]
"loopx.opencode2_goal_mode" = ["*.mjs", "README.md"]
"loopx.pi_goal_mode" = ["*.ts", "*.mjs", "README.md"]
"loopx.kunluncode_goal_mode" = ["README.md"]

[tool.setuptools.data-files]
"share/loopx/skills/loopx-project" = [
  "skills/loopx-project/SKILL.md",
]
"share/loopx/skills/loopx-project/agents" = [
  "skills/loopx-project/agents/openai.yaml",
]
"share/loopx/skills/loopx-pr-program" = [
  "skills/loopx-pr-program/SKILL.md",
]
"share/loopx/skills/loopx-pr-program/agents" = [
  "skills/loopx-pr-program/agents/openai.yaml",
]
"share/loopx/skills/loopx-pr-program/references" = [
  "skills/loopx-pr-program/references/snapshot-contract.md",
]
"share/loopx/skills/loopx-pr-program/scripts" = [
  "skills/loopx-pr-program/scripts/diff_snapshot.py",
]
"share/loopx/skills/loopx-pr-review" = [
  "skills/loopx-pr-review/SKILL.md",
]
"share/loopx/skills/loopx-pr-review/agents" = [
  "skills/loopx-pr-review/agents/openai.yaml",
]
"share/loopx/skills/loopx-doc-registry" = [
  "skills/loopx-doc-registry/SKILL.md",
]
"share/loopx/skills/loopx-doc-registry/agents" = [
  "skills/loopx-doc-registry/agents/openai.yaml",
]
"share/loopx/skills/loopx-benchmark" = [
  "skills/loopx-benchmark/SKILL.md",
]
"share/loopx/skills/loopx-benchmark/agents" = [
  "skills/loopx-benchmark/agents/openai.yaml",
]
"share/loopx/skills/loopx-self-repair" = [
  "skills/loopx-self-repair/SKILL.md",
]
"share/loopx/skills/loopx-self-repair/agents" = [
  "skills/loopx-self-repair/agents/openai.yaml",
]
"share/loopx/skills/loopx-self-repair/references" = [
  "skills/loopx-self-repair/references/repair-patterns.md",
  "skills/loopx-self-repair/references/upstream-issue-escalation.md",
]

[tool.pytest.ini_options]
norecursedirs = ["deprecate"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "loopx/control_plane/__init__.py",
  "loopx/control_plane/coordination/executor.py",
  "loopx/control_plane/coordination/file_provider.py",
  "loopx/control_plane/coordination/head.py",
  "loopx/control_plane/quota/effect_program.py",
  "loopx/control_plane/quota/states.py",
  "loopx/control_plane/runtime/event_store_migration_bridge.py",
  "loopx/control_plane/runtime/time.py",
  "loopx/control_plane/runtime/trajectory_hygiene.py",
  "loopx/control_plane/scheduler/time.py",
  "loopx/control_plane/work_items/delivery_batch_scale.py",
  "loopx/control_plane/work_items/delivery_outcome.py",
  "loopx/control_plane/work_items/lifecycle.py",
  "loopx/presentation/renderers/trajectory_hygiene_markdown.py",
  "loopx/presentation/renderers/turn_envelope_markdown.py",
]
