<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-label="Proposed shared-goal coordination topology: endpoint daemons send controlled commands to one LoopX authority, with file and NoKV provider candidates; wake, projections, host-local state, and independent ledgers remain outside the coordination head">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
  </defs>
  <g font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="1" y="1" width="1078" height="608" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- endpoints (left column) -->
    <rect x="50" y="90" width="200" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="150" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">laptop daemon</text>
    <text x="150" y="144" text-anchor="middle" font-size="11" fill="#64748b">reviewer agent · 本机</text>

    <rect x="50" y="210" width="200" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="150" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">devbox daemon</text>
    <text x="150" y="264" text-anchor="middle" font-size="11" fill="#64748b">coder agent · 开发机</text>

    <rect x="50" y="330" width="200" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="150" y="362" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">cloud sandbox daemon</text>
    <text x="150" y="384" text-anchor="middle" font-size="11" fill="#64748b">managed agent · 云沙箱</text>

    <!-- endpoint -> authority arrows -->
    <path d="M250 128 C330 128 350 180 426 205" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M250 248 L426 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M250 368 C330 368 350 330 426 315" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- transport annotation, in clear space below the corridor -->
    <text x="340" y="444" text-anchor="middle" font-size="11" fill="#475569">outbound authenticated channel · transport-specific</text>
    <text x="340" y="462" text-anchor="middle" font-size="11" fill="#94a3b8">认证协议与部署另行定义</text>

    <!-- authority (center) -->
    <rect x="430" y="160" width="260" height="200" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="560" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">LoopX authority</text>
    <text x="560" y="214" text-anchor="middle" font-size="11" fill="#4338ca">唯一在线权威 · single online authority</text>
    <rect x="450" y="230" width="220" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="560" y="247" text-anchor="middle" font-size="10.5" fill="#3730a3">受控命令 loopx_command_v0</text>
    <rect x="450" y="264" width="220" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="560" y="281" text-anchor="middle" font-size="10.5" fill="#3730a3">target preconditions · 原始回执</text>
    <rect x="450" y="298" width="220" height="26" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="560" y="315" text-anchor="middle" font-size="10.5" fill="#3730a3">租约 lease / epoch · pull 认领</text>

    <!-- authority -> file provider (solid green), label above the arrow in free space -->
    <path d="M690 210 C730 195 755 175 796 160" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ahGreen)"/>
    <text x="790" y="138" text-anchor="end" font-size="10.5" fill="#047857">拟议主提交 · proposed primary CAS</text>

    <!-- authority -> NoKV provider (dashed amber), label below the arrow in free space -->
    <path d="M690 310 C730 330 755 395 796 428" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ahAmber)"/>
    <text x="728" y="396" text-anchor="end" font-size="10.5" fill="#b45309">影子登记 shadow · generation CAS</text>

    <!-- file provider (primary) -->
    <rect x="800" y="110" width="230" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="816" y="124" width="100" height="19" rx="9.5" fill="#059669"/>
    <text x="866" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#ffffff">candidate · 主候选</text>
    <text x="816" y="166" font-size="15" font-weight="600" fill="#064e3b">file provider</text>
    <text x="816" y="187" font-size="11" fill="#475569">shared-mode aggregate candidate</text>

    <!-- reconcile link with label plate -->
    <path d="M915 204 L915 396" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <rect x="836" y="276" width="158" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="915" y="294" text-anchor="middle" font-size="10.5" fill="#475569">对账 reconcile</text>
    <text x="915" y="311" text-anchor="middle" font-size="10" fill="#94a3b8">零 mismatch → 晋升门</text>

    <!-- NoKV provider (shadow) -->
    <rect x="800" y="400" width="230" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 3"/>
    <rect x="816" y="414" width="100" height="19" rx="9.5" fill="#d97706"/>
    <text x="866" y="427" text-anchor="middle" font-size="9.5" font-weight="600" fill="#ffffff">candidate · shadow</text>
    <text x="816" y="456" font-size="15" font-weight="600" fill="#78350f">NoKV provider</text>
    <text x="816" y="477" font-size="11" fill="#475569">opaque aggregate candidate · CAS</text>

    <!-- state outside the canonical coordination head -->
    <rect x="50" y="510" width="980" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="540" y="530" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">coordination head 之外 · outside the coordination head</text>
    <text x="540" y="548" text-anchor="middle" font-size="10" fill="#64748b">Agent IM / wake (out of scope; no state authority) · derived status · host-local state · independent ledgers</text>

    <!-- footer -->
    <text x="540" y="582" text-anchor="middle" font-size="11" fill="#64748b">provider-neutral · 默认本地模式不变 · shadow / canary 不获得状态权威</text>
    <text x="1062" y="600" text-anchor="end" font-size="9" fill="#cbd5e1">shared-goal coordination topology · v0</text>
  </g>
</svg>
