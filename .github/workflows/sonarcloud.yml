name: SonarCloud

on:
  pull_request:
    paths:
      - ".github/workflows/sonarcloud.yml"
      - "sonar-project.properties"
      - "loopx/**"
      - "apps/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "tsconfig.control-plane.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sonarcloud.yml"
      - "sonar-project.properties"
      - "loopx/**"
      - "apps/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "tsconfig.control-plane.json"

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud analysis (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Detect whether the token is available
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "${SONAR_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip analysis when the token is unavailable
        if: steps.sonar-token.outputs.available != 'true'
        run: echo "SONAR_TOKEN is unavailable; non-blocking analysis skipped."

      - name: Check out repository
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        if: steps.sonar-token.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run fast tests with coverage XML
        if: steps.sonar-token.outputs.available == 'true'
        run: >-
          python -m pytest -q -n 2
          --durations=25 --durations-min=1
          --cov=loopx
          --cov-report=term
          --cov-report=xml:coverage.xml

      - name: SonarCloud scan
        if: steps.sonar-token.outputs.available == 'true'
        # Analysis-only: findings are reported to the PR/dashboard but never
        # block merge. Remove this flag only if the quality gate becomes a
        # required check.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
