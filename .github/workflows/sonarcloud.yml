name: SonarCloud

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud analysis (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Detect whether the token is available
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "${SONAR_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip analysis when the token is unavailable
        if: steps.sonar-token.outputs.available != 'true'
        run: echo "SONAR_TOKEN is unavailable; non-blocking analysis skipped."

      - name: Check out repository
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download this run's combined coverage
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: python-coverage-xml

      - name: SonarCloud scan
        if: steps.sonar-token.outputs.available == 'true'
        # Analysis-only: findings are reported to the PR/dashboard but never
        # block merge. Remove this flag only if the quality gate becomes a
        # required check.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
